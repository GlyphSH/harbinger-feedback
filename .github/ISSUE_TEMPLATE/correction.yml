name: Correction
description: Report a wrong or outdated fact on a feed row
title: "Correction: CVE-"
labels: [correction]
body:
  - type: input
    id: cve
    attributes:
      label: CVE
      placeholder: CVE-2026-12345
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Feed date shown on the page
      placeholder: "2026-10-10"
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what is correct
      description: Link a public source for the correct fact. No exploit code or embargoed details.
    validations:
      required: true
